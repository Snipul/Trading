name: Double bottom test

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker (ex: AAPL.US ou XBTUSD)"
        required: true
        default: "AAPL.US"
      source:
        description: "eodhd ou kraken"
        required: true
        default: "eodhd"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests matplotlib
      - name: Lancer la détection
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: python double_bottom.py --symbol "${{ inputs.symbol }}" --source "${{ inputs.source }}"
      - uses: actions/upload-artifact@v4
        with:
          name: graphique
          path: "*.png"
