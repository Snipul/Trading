name: Stromboli

on:
  schedule:
    # Un seul cron, tous les jours, 21h30 UTC = 23h30 heure d'ete / 22h30 heure d'hiver.
    # L'univers scanne varie selon le jour (voir etape "Determiner les parametres") :
    # tout (actions+crypto) en semaine, crypto seul le week-end.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      tf:
        description: "Unites de temps, combinaison de D, W, M (ex: DWM)"
        required: false
        default: "DW"
      univers:
        description: "tout, us, euronext, paris, amsterdam, bruxelles, indices, crypto"
        required: false
        default: "tout"
      dry_run:
        description: "Ne pas envoyer sur Telegram"
        type: boolean
        required: false
        default: false
      backtest_annees:
        description: "Backtest Fernanda : nombre d'annees (0 = scan normal)"
        required: false
        default: "0"
      diagnostic_ticker:
        description: "Diagnostic detaille pour un ticker (ex: ELI.BR), vide = desactive"
        required: false
        default: ""
      seuil_doji:
        description: "Seuil du doji, fraction du range (0.05 = 5%)"
        required: false
        default: "0.05"
      tolerance_meche:
        description: "Tolerance sur la meche des bougies pleines, fraction du range (0.0 = strict, 0.005 = 0.5%)"
        required: false
        default: "0.0"
      rsi2_volume_min:
        description: "Alerte RSI-2 live (US/Euronext) : pic de volume minimum au signal, fois la moyenne 20j"
        required: false
        default: "2.0"
      doji_dragonfly:
        description: "Accepter aussi le doji dragonfly (pas de meche haute)"
        type: boolean
        required: false
        default: true
      volume_min_backtest:
        description: "Backtest uniquement : filtre volume >= x fois la moyenne au doji (vide = pas de filtre)"
        required: false
        default: ""
      avec_fernando:
        description: "Backtest uniquement : calcule aussi le miroir baissier Fernando/short (analyse, jamais en scan reel)"
        type: boolean
        required: false
        default: false
      setup_backtest:
        description: "Backtest uniquement : inchi, retour-moyenne (RSI-2/IBS+MM200), retour-moyenne-partiel (MM5+Bollinger/breakeven), ema-cross, ou ema-cross-partiel"
        required: false
        default: "inchi"
      stop_loss_backtest:
        description: "Setup retour-moyenne uniquement : stop loss en % (ex: -8), vide = pas de stop"
        required: false
        default: ""
      validation_croisee:
        description: "Setup retour-moyenne uniquement : decoupe en decouverte/validation (hors echantillon)"
        type: boolean
        required: false
        default: false
      frais_pct_backtest:
        description: "Setup retour-moyenne uniquement : frais aller-retour en % de la position (ex: 0.2 pour 2 euros sur 1000 euros), vide/0 = aucun frais"
        required: false
        default: ""
      volume_min_signal_backtest:
        description: "Setup retour-moyenne uniquement : garde les signaux avec pic de volume >= x fois la moyenne 20j (ex: 2), vide = pas de filtre"
        required: false
        default: ""
      volume_min_liquidite_backtest:
        description: "Setup retour-moyenne uniquement : garde les signaux dont la liquidite moyenne 60j >= X titres/jour (ex: 500000), vide = pas de filtre"
        required: false
        default: ""
      entree_lendemain:
        description: "Setup retour-moyenne uniquement : simule une entree REALISTE a l'ouverture du lendemain, pas la cloture du signal"
        type: boolean
        required: false
        default: false
      valider_univers:
        description: "Lister les tickers de l'univers choisi et ceux sans donnees Yahoo (--valider-univers)"
        type: boolean
        required: false
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: pip install pandas numpy requests lxml

      - name: Determiner les parametres
        id: params
        run: |
          if [ -n "${{ github.event.inputs.tf }}" ]; then
            echo "tf=${{ github.event.inputs.tf }}" >> $GITHUB_OUTPUT
          else
            tf="D"
            if [ "$(date -u +%u)" = "5" ]; then
              tf="${tf}W"
            fi
            demain=$(date -u -d "+1 day" +%d)
            if [ "$demain" = "01" ]; then
              tf="${tf}M"
            fi
            echo "tf=$tf" >> $GITHUB_OUTPUT
          fi

          # Week-end (samedi=6, dimanche=7) : crypto seul, les marches actions
          # sont fermes donc inutile de re-scanner ~1500 tickers pour rien.
          jour=$(date -u +%u)
          if [ "$jour" -ge 6 ]; then
            echo "univers=crypto" >> $GITHUB_OUTPUT
          else
            echo "univers=tout" >> $GITHUB_OUTPUT
          fi

      - name: Scan Stromboli
        if: (github.event.inputs.backtest_annees == '0' || github.event.inputs.backtest_annees == '') && (github.event.inputs.diagnostic_ticker == '' || github.event.inputs.diagnostic_ticker == null) && github.event.inputs.valider_univers != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STROMBOLI_MIN_BOUGIES: "3"
          STROMBOLI_SEUIL_DOJI: ${{ github.event.inputs.seuil_doji || '0.05' }}
          STROMBOLI_TOLERANCE: ${{ github.event.inputs.tolerance_meche || '0.0' }}
          STROMBOLI_DOJI_DRAGONFLY: ${{ github.event.inputs.doji_dragonfly || 'true' }}
          RSI2_VOLUME_MIN: ${{ github.event.inputs.rsi2_volume_min || '2.0' }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python stromboli.py \
            --tf ${{ steps.params.outputs.tf }} \
            --univers ${{ github.event.inputs.univers || steps.params.outputs.univers }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Backtest Fernanda
        if: github.event.inputs.backtest_annees != '0' && github.event.inputs.backtest_annees != ''
        env:
          STROMBOLI_MIN_BOUGIES: "3"
          STROMBOLI_SEUIL_DOJI: ${{ github.event.inputs.seuil_doji || '0.05' }}
          STROMBOLI_TOLERANCE: ${{ github.event.inputs.tolerance_meche || '0.0' }}
          STROMBOLI_DOJI_DRAGONFLY: ${{ github.event.inputs.doji_dragonfly || 'true' }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python stromboli.py \
            --backtest ${{ github.event.inputs.backtest_annees }} \
            --univers ${{ github.event.inputs.univers || 'tout' }} \
            ${{ github.event.inputs.volume_min_backtest != '' && format('--volume-min {0}', github.event.inputs.volume_min_backtest) || '' }} \
            ${{ github.event.inputs.avec_fernando == 'true' && '--avec-fernando' || '' }} \
            --setup ${{ github.event.inputs.setup_backtest || 'inchi' }} \
            ${{ github.event.inputs.stop_loss_backtest != '' && format('--stop-loss {0}', github.event.inputs.stop_loss_backtest) || '' }} \
            ${{ github.event.inputs.validation_croisee == 'true' && '--validation-croisee' || '' }} \
            ${{ github.event.inputs.frais_pct_backtest != '' && format('--frais-pct {0}', github.event.inputs.frais_pct_backtest) || '' }} \
            ${{ github.event.inputs.volume_min_signal_backtest != '' && format('--volume-min-signal {0}', github.event.inputs.volume_min_signal_backtest) || '' }} \
            ${{ github.event.inputs.volume_min_liquidite_backtest != '' && format('--volume-min-liquidite {0}', github.event.inputs.volume_min_liquidite_backtest) || '' }} \
            ${{ github.event.inputs.entree_lendemain == 'true' && '--entree-lendemain' || '' }}

      - name: Publier le detail du backtest
        if: github.event.inputs.backtest_annees != '0' && github.event.inputs.backtest_annees != ''
        uses: actions/upload-artifact@v4
        with:
          name: backtest-fernanda
          path: |
            backtest_stromboli.csv
            backtest_fernanda.csv
            backtest_fernando.csv
            backtest_rm_rsi2.csv
            backtest_rm_ibs.csv
            backtest_ema_cross.csv
            backtest_ema_cross_partiel.csv
          if-no-files-found: ignore

      - name: Diagnostic ticker
        if: github.event.inputs.diagnostic_ticker != '' && github.event.inputs.diagnostic_ticker != null
        env:
          STROMBOLI_MIN_BOUGIES: "3"
          STROMBOLI_SEUIL_DOJI: ${{ github.event.inputs.seuil_doji || '0.05' }}
          STROMBOLI_TOLERANCE: ${{ github.event.inputs.tolerance_meche || '0.0' }}
          STROMBOLI_DOJI_DRAGONFLY: ${{ github.event.inputs.doji_dragonfly || 'true' }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python stromboli.py \
            --tf ${{ steps.params.outputs.tf }} \
            --diagnostic ${{ github.event.inputs.diagnostic_ticker }}

      - name: Valider univers
        if: github.event.inputs.valider_univers == 'true'
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python stromboli.py \
            --univers ${{ github.event.inputs.univers || 'tout' }} \
            --valider-univers
