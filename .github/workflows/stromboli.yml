name: Stromboli

on:
  schedule:
    # Daily du lundi au jeudi, 21h30 UTC = 23h30 heure d'ete / 22h30 heure d'hiver
    # (marge confortable apres cloture US toute l'annee, sans ajustement DST)
    - cron: "30 21 * * 1-4"
    # Vendredi, meme horaire : Daily + Weekly
    - cron: "30 21 * * 5"
  workflow_dispatch:
    inputs:
      tf:
        description: "Unites de temps (D, W ou DW)"
        required: false
        default: "DW"
      univers:
        description: "tout, us, euronext, paris, amsterdam, bruxelles, indices, crypto"
        required: false
        default: "tout"
      dry_run:
        description: "Ne pas envoyer sur Telegram"
        type: boolean
        required: false
        default: false
      backtest_annees:
        description: "Backtest Fernanda : nombre d'annees (0 = scan normal)"
        required: false
        default: "0"
      diagnostic_ticker:
        description: "Diagnostic detaille pour un ticker (ex: ELI.BR), vide = desactive"
        required: false
        default: ""

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: pip install yfinance pandas numpy requests lxml

      - name: Determiner les unites de temps
        id: params
        run: |
          if [ -n "${{ github.event.inputs.tf }}" ]; then
            echo "tf=${{ github.event.inputs.tf }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%u)" = "5" ]; then
            echo "tf=DW" >> $GITHUB_OUTPUT
          else
            echo "tf=D" >> $GITHUB_OUTPUT
          fi

      - name: Scan Stromboli
        if: (github.event.inputs.backtest_annees == '0' || github.event.inputs.backtest_annees == '') && (github.event.inputs.diagnostic_ticker == '' || github.event.inputs.diagnostic_ticker == null)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STROMBOLI_MIN_BOUGIES: "3"
          STROMBOLI_SEUIL_DOJI: "0.05"
          STROMBOLI_TOLERANCE: "0.0"
        run: |
          python stromboli.py \
            --tf ${{ steps.params.outputs.tf }} \
            --univers ${{ github.event.inputs.univers || 'tout' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Backtest Fernanda
        if: github.event.inputs.backtest_annees != '0' && github.event.inputs.backtest_annees != ''
        env:
          STROMBOLI_MIN_BOUGIES: "3"
          STROMBOLI_SEUIL_DOJI: "0.05"
          STROMBOLI_TOLERANCE: "0.0"
        run: |
          python stromboli.py \
            --backtest ${{ github.event.inputs.backtest_annees }} \
            --univers ${{ github.event.inputs.univers || 'tout' }}

      - name: Publier le detail du backtest
        if: github.event.inputs.backtest_annees != '0' && github.event.inputs.backtest_annees != ''
        uses: actions/upload-artifact@v4
        with:
          name: backtest-fernanda
          path: backtest_fernanda.csv
          if-no-files-found: ignore

      - name: Diagnostic ticker
        if: github.event.inputs.diagnostic_ticker != '' && github.event.inputs.diagnostic_ticker != null
        env:
          STROMBOLI_MIN_BOUGIES: "3"
          STROMBOLI_SEUIL_DOJI: "0.05"
          STROMBOLI_TOLERANCE: "0.0"
        run: |
          python stromboli.py \
            --tf ${{ steps.params.outputs.tf }} \
            --diagnostic ${{ github.event.inputs.diagnostic_ticker }}
